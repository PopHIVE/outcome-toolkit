# OpenAPI Specs
openapi: 3.0.0
info:
  title: Outcome Toolkit API
  description: |-
    This is the API Documentation for the Outcome Toolkit Backend API.
  version: '1.0'
servers:
  - url: http://localhost:80
tags:
  - name: v1
    description: V1 Routes
  - name: v2
    description: V2 Routes

#===============================================================================

paths:
  # backend/app/routes/api/v1_refactor/geometries_routes.py
  /api/{geography}/geometries:
    get:
      tags:
        - v1
      summary: Get GeoJSON Geometries in a Feature Collection by Geographic Type (i.e. state, county, zcta3, zcta5).
      parameters:
        - $ref: '#/components/parameters/geographyParam'
        - $ref: '#/components/parameters/stateParam'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        422:
          $ref: '#/components/responses/InvalidParamError'

  # backend/app/routes/api/v1_refactor/properties_routes.py
  /api/{geography}/properties:
    post:
      tags:
        - v1
      summary: Get Properties and Data
      description: Get Detailed demographic and outcome data.
      parameters:
        - $ref: '#/components/parameters/geographyParam'
        - $ref: '#/components/parameters/stateParam'
      requestBody:
        $ref: '#/components/requestBodies/midBody'
      responses:
        200:
          $ref: '#/components/responses/PropertiesResponse'
        422:
          $ref: '#/components/responses/InvalidParamError'
    
  # backend/app/routes/api/v1_refactor/misc.py
  /api/state/tree:
    get:
      tags:
        - v1
      summary: Get Metadata for Picklist.
      description: Returns the picklist formatted display text for counties and zcta3s keyed by state.
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
  
  # backend/app/routes/api/v1_refactor/misc.py
  /api/bins:
    get:
      tags:
        - v1
      summary: Get Bin Statistics
      description: Returns basic bin statistics for map legend keyed by outcome measure.
      parameters:
        - $ref: '#/components/parameters/outcomeParam'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/binBundle'

  # backend/app/routes/api/v1_refactor/misc.py
  /api/download:
    post:
      tags:
        - v1
      summary: Get Data for Download.
      description: Generate Data for Downloading the CSV.
      requestBody:
        $ref: '#/components/requestBodies/outcomeGeoMIDBody'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  'header_row':
                    type: array
                    items:
                      type: object
                  'totals_row':
                    type: array
                    items:
                      type: object
                  'data_rows':
                    type: array
                    items:
                      type: object
        422:
          $ref: '#/components/responses/InvalidParamError'

  # backend/app/routes/api/v1_refactor/misc.py
  /api/national/distributions:
    post:
      tags:
        - v1
      summary: Get National Distributions of Demographic Data
      description: Get National Distributions of Demographic Data keyed by geography type.
      requestBody:
        $ref: '#/components/requestBodies/midBody'
      responses:
        200:
          $ref: '#/components/responses/PropertiesResponse'
        422:
          $ref: '#/components/responses/InvalidParamError'
          
          
  # backend/app/routes/api/v2/bin_routes.py
  /api/v2/bins:
    get:
      tags:
        - v2
      summary: Get Bins Data by Outcome
      description: Get Bins Data by Outcome. Results are keyed by Outcome, then Measure.
      parameters:
        - $ref: '#/components/parameters/outcomeParam'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/binBundleV2'
        422:
          $ref: '#/components/responses/InvalidParamError'

  # backend/app/routes/api/v2/details_routes.py
  /api/v2/details:
    post:
      tags:
        - v2
      summary: Get Detailed Metric Values filtered by Outcome, MIDs, and Metrics.
      description: Get Detailed Metric Values filtered by Outcome, MID, and Metric. Results are keyed by MID, then Measure.
      requestBody:
        $ref: '#/components/requestBodies/detailMetricMIDBody'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/binBundleV2'
        422:
          $ref: '#/components/responses/InvalidParamError'

  # backend/app/routes/api/v2/geometries_routes.py
  /api/v2/{geography}/geometries:
    get:
      tags:
        - v2
      summary: Get GeoJSON Geometries in a Feature Collection by Geographic Type (i.e. state, county, zcta3, zcta5).
      parameters:
        - $ref: '#/components/parameters/geographyParam'
        - $ref: '#/components/parameters/stateParam'
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        422:
          $ref: '#/components/responses/InvalidParamError'
  
  # backend/app/routes/api/v2/overview_routes.py
  /api/v2/overview:
    get:
      tags:
        - v2
      summary: Get Bin Rank of MIDs for specific Metric and Outcome. Results are keyed by MID.
      parameters:
        - $ref: '#/components/parameters/outcomeParam'
        - $ref: '#/components/parameters/metricParam'
        - $ref: '#/components/parameters/startDateParam'
        - $ref: '#/components/parameters/endDateParam'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
        422:
          $ref: '#/components/responses/InvalidParamError'

  # backend/app/routes/api/v2/demographic_routes.py
  /api/v2/demographics:
    get:
      tags:
        - v2
      summary: Get demographic data of MIDs. Binned for population age and income. Result json is keyed by MID.
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/demographicsResponse'

  # backend/app/routes/api/v2/demographic_routes.py
  /api/v2/demographics/overview:
    get:
      tags:
        - v2
      summary: Get Bin Rank of MIDs for specific Metric and Outcome. Results are keyed by MID.
      parameters:
        - $ref: '#/components/parameters/demographicMetricParam'
        - $ref: '#/components/parameters/demographicDataSourceParam'
        - $ref: '#/components/parameters/geographyParam'
      # requestBody:
      #   $ref: '#/components/requestBodies/midBody'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
        422:
          $ref: '#/components/responses/InvalidParamError'

#===============================================================================

components:
  schemas:
    geography:
      type: string
      description: The geographic type/resolution (i.e. state, county, zcta3, zcta5)
      example: zcta3
      enum:
        - state
        - county
        - zcta3
        - zcta5
    mid:
      type: string
      description: Morpheus ID. Unique ID representing a Census Geometry. Takes the form "<Geography> <Census GEOID>"
      example: 'ZCTA3 012'
    outcome:
      type: string
      description: Outcome
      example: soc
      enum:
        - alcohol
        - cardio
        - opioid
        - soc
    metric:
      type: string
      description: Metric
      example: any_soc_rate
      enum:
        - alcohol_rate_rank
        - opioid_rate_rank
        - any_soc_rate
        - total_mean
    demographicsResponse:
      type: object
      description: JSON response to the v2 demographics route. Contains demographic data for STATE, ZCTA3 and COUNTY MIDs.
      properties:
        metadata:
          $ref: '#/components/schemas/demographicsMetadata'
        data:
          $ref: '#/components/schemas/demographicsData'
    demographicsMetadata:
      type: object
      description: Contains categories and their respective bands. Band strings are used to retrieve MID specific data.
      properties:
        'source':
          type: string
        'demographic_categories':
          type: object
          additionalProperties:
            type: object
            properties:
              'band':
                type: array
                items:
                  type: string
        'display_names':
          type: object
          properties:
            'band name 1':
              type: string
            'band name 2':
              type: string
            'band name 3':
              type: string
    demographicsData:
      type: object
      description: Contains MID specific data that can be retrieved using the metadata bands.
      properties:
        'Example MID 1':
          type: object
          properties:
            'band name 1':
              oneOf:
                - type: string
                - type: number
            'band name 2':
              oneOf:
                - type: string
                - type: number
            'band name 3':
              oneOf:
                - type: string
                - type: number
        'Example MID 2':
          type: object
          properties:
            'band name 1':
              oneOf:
                - type: string
                - type: number
            'band name 2':
              oneOf:
                - type: string
                - type: number
            'band name 3':
              oneOf:
                - type: string
                - type: number
        'Example MID 3':
          type: object
          properties:
            'band name 1':
              example: 'string, numeric, or list[string]'
            'band name 2':
              example: 'string, numeric, or list[string]'
            'band name 3':
              example: 'string, numeric, or list[string]'
    demographicMetric:
      type: string
      description: 
      example: total_population
      enum:
        - total_population
        - pop_0_5
        - pop_5_9
        - pop_10_14
        - pop_15_19
        - pop_20_24
        - pop_25_29
        - pop_30_34
        - pop_35_39
        - pop_40_44
        - pop_45_49
        - pop_50_54
        - pop_55_59
        - pop_60_64
        - pop_65_69
        - pop_70_74
        - pop_75_79
        - pop_80_84
        - pop_85_over
        - pop_white
        - pop_black
        - pop_american_indian
        - pop_asian
        - pop_pacific_isl
        - pop_other
        - pop_multi
        - total_households
        - less_than_10k
        - between_10k_15k
        - between_15k_20k
        - between_20k_25k
        - between_25k_30k
        - between_30k_35k
        - between_35k_40k
        - between_40k_45k
        - between_45k_50k
        - between_50k_50k
        - between_60k_75k
        - between_75k_100k
        - between_100k_125k
        - between_125k_150k
        - between_150k_200k
        - over_200k
    isoDate:
      type: string
      description: String in ISO Datetime format
    invalidParam:
      type: object
      description: Invalid User Provided Value
      properties:
        'message':
          type: string
        'description':
          type: string
        'request_id':
          type: string
    binBundle:
      type: object
      properties:
        'start_date':
          type: string
        'end_date':
          type: string
        'label':
          type: string
        'min':
          type: number
        'max':
          type: number
        'rank':
          type: number
        'representative':
          type: number
    binBundleV2:
      type: object
      properties:
        'rank':
          type: number
        'rankValue':
          type: string
        'median':
          type: number
        'mean':
          type: number
        'midpoint':
          type: number
        'min':
          type: number
        'max':
          type: number
        'representative':
          type: number
    dataBundle:
      type: object
      description: Data Bundle
      properties:
        'display_name':
          type: string
        'label':
          type: string
        'metric':
          type: string
        'value':
          type: number
    dataMetadata:
      type: object
      description: Row Metadata
      properties:
        created:
          type: string
        data_provider:
          type: string
        data_release:
          type: string
        end_date:
          type: string
        start_date:
          type: string
        mid:
          $ref: '#/components/schemas/mid'
        name:
          type: string
        'type':
          $ref: '#/components/schemas/geography'
    dataSourceProperties:
      type: object
      description: Data Source Properties
      properties:
        'age':
          type: array
          items:
            $ref: '#/components/schemas/dataBundle'
        'age+sex':
          type: array
          items:
            $ref: '#/components/schemas/dataBundle'
        'general':
          type: array
          items:
            $ref: '#/components/schemas/dataBundle'
        'income':
          type: array
          items:
            $ref: '#/components/schemas/dataBundle'
        'race/ethnicity':
          type: array
          items:
            $ref: '#/components/schemas/dataBundle'
        'sex':
          type: array
          items:
            $ref: '#/components/schemas/dataBundle'
        'metadata':
          $ref: '#/components/schemas/dataMetadata'
    intersections:
      type: object
      description: 'Intersecting geometries at different resolutions.'
      properties:
        'COUNTY':
          type: array
          items:
            $ref: '#/components/schemas/mid'
        'STATE':
          type: array
          items:
            $ref: '#/components/schemas/mid'
        'ZCTA3':
          type: array
          items:
            $ref: '#/components/schemas/mid'
        'ZCTA5':
          type: array
          items:
            $ref: '#/components/schemas/mid'
    adjacencies:
      type: array
      items:
        $ref: '#/components/schemas/mid'
    midProperties:
      type: object
      description: MID Properties.
      properties:
        'acs_estimates':
          $ref: '#/components/schemas/dataSourceProperties'
        'alcohol':
          $ref: '#/components/schemas/dataSourceProperties'
        'opioid':
          $ref: '#/components/schemas/dataSourceProperties'
        'cardio':
          $ref: '#/components/schemas/dataSourceProperties'
        'soc':
          $ref: '#/components/schemas/dataSourceProperties'
        'demographics':
          $ref: '#/components/schemas/dataSourceProperties'
        'metadata':
          $ref: '#/components/schemas/dataMetadata'
        'intersections':
          $ref: '#/components/schemas/intersections'
        'adjacencies':
          $ref: '#/components/schemas/adjacencies'
        
#---------------------------------------------------------------------------
# GeoJSON Specs From: https://gist.github.com/zit0un/3ac0575eb0f3aabdc645c3faad47ab4a

    'GeoJsonObject':
      description: >
        GeoJSon object
        The coordinate reference system for all GeoJSON coordinates is a
        geographic coordinate reference system, using the World Geodetic System
        1984 (WGS 84) datum, with longitude and latitude units of decimal
        degrees.
        This is equivalent to the coordinate reference system identified by the
        Open Geospatial Consortium (OGC) URN
        An OPTIONAL third-position element SHALL be the height in meters above
        or below the WGS 84 reference ellipsoid.
        In the absence of elevation values, applications sensitive to height or
        depth SHOULD interpret positions as being at local ground or sea level.
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3'
      type: object
      properties:
        'type':
          type: string
          enum:
          - Feature
          - FeatureCollection
          - Point
          - MultiPoint
          - LineString
          - MultiLineString
          - Polygon
          - MultiPolygon
          - GeometryCollection
      required:
      - type
      discriminator:  
        propertyName: type

    #---------------------------------------------------------------------------
    'Geometry':
      description: >
        Abstract type for all GeoJSon object except Feature and
        FeatureCollection
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3'
      allOf:
      - $ref: '#/components/schemas/GeoJsonObject'
      - type: object
        properties:
          'type':
            type: string
            enum:
            - Point
            - MultiPoint
            - LineString
            - MultiLineString
            - Polygon
            - MultiPolygon
            - GeometryCollection
        required:
        - type
        discriminator:
          propertyName: type

    #---------------------------------------------------------------------------
    'GeometryElement':
      description: >
        Abstract type for all GeoJSon 'Geometry' object the type of which is not
        'GeometryCollection'
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3'
      allOf:
      - $ref: '#/components/schemas/Geometry'
      - type: object
        properties:
          'type':
            type: string
            enum:
            - Point
            - MultiPoint
            - LineString
            - MultiLineString
            - Polygon
            - MultiPolygon
        required:
        - type
        discriminator:
          propertyName: type

    #---------------------------------------------------------------------------
    'Feature':
      description: GeoJSon 'Feature' object
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.2'
      allOf:
      - $ref: '#/components/schemas/GeoJsonObject'
      - type: object
        required:
        - geometry
        - properties
        properties:
          'geometry':
            allOf:
            - nullable: true
            - $ref: '#/components/schemas/Geometry'
          'properties':
            type: object
            nullable: true
          'id':
            oneOf:
            - type: number
            - type: string

    #---------------------------------------------------------------------------
    'FeatureCollection':
      description: GeoJSon 'FeatureCollection' object
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.3'
      allOf:
      - $ref: '#/components/schemas/GeoJsonObject'
      - type: object
        required:
        - type
        - features
        properties:
          'features':
            type: array
            items:
              $ref: '#/components/schemas/Feature'
          'type':
            type: string
            example: 'FeatureCollection'

    #---------------------------------------------------------------------------
    'Position':
      description: >
        GeoJSon fundamental geometry construct.
        A position is an array of numbers. There MUST be two or more elements.
        The first two elements are longitude and latitude, or easting and
        northing, precisely in that order and using decimal numbers.
        Altitude or elevation MAY be included as an optional third element.
        Implementations SHOULD NOT extend positions beyond three elements
        because the semantics of extra elements are unspecified and ambiguous.
        Historically, some implementations have used a fourth element to carry
        a linear referencing measure (sometimes denoted as "M") or a numerical
        timestamp, but in most situations a parser will not be able to properly
        interpret these values. The interpretation and meaning of additional
        elements is beyond the scope of this specification, and additional
        elements MAY be ignored by parsers.
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.1'
      type: array
      minItems: 2
      maxItems: 3
      items:
        type: number

    #---------------------------------------------------------------------------
    'LineStringCoordinates':
      description: >
        GeoJSon fundamental geometry construct, array of two or more positions.
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.4'
      type: array
      items:
        $ref: '#/components/schemas/Position'
      minItems: 2

    #---------------------------------------------------------------------------
    'LinearRing':
      description: >
        A linear ring is a closed LineString with four or more positions.
        The first and last positions are equivalent, and they MUST contain
        identical values; their representation SHOULD also be identical.
        A linear ring is the boundary of a surface or the boundary of a hole in
        a surface.
        A linear ring MUST follow the right-hand rule with respect to the area
        it bounds, i.e., exterior rings are counterclockwise, and holes are
        clockwise.
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.6'
      type: array
      items:
        $ref: '#/components/schemas/Position'
      minItems: 4

    #---------------------------------------------------------------------------
    'Point':
      description: GeoJSon geometry
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.2'
      allOf:
        - $ref: '#/components/schemas/GeometryElement'
        - type: object
          required:
          - type
          - coordinates
          properties:
            'type':
              type: 'string'
              enum: [Point]
            'coordinates':
              $ref: '#/components/schemas/Position'

    #---------------------------------------------------------------------------
    'MultiPoint':
      description: GeoJSon geometry
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.3'
      allOf:
        - $ref: '#/components/schemas/GeometryElement'
        - type: object
          required:
          - coordinates
          properties:
            'coordinates':
              type: array
              items:
                $ref: '#/components/schemas/Position'

    #---------------------------------------------------------------------------
    'LineString':
      description: GeoJSon geometry
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.4'
      allOf:
        - $ref: '#/components/schemas/GeometryElement'
        - type: object
          required:
          - coordinates
          properties:
            'coordinates':
              $ref: '#/components/schemas/LineStringCoordinates'

    #---------------------------------------------------------------------------
    'MultiLineString':
      description: GeoJSon geometry
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.5'
      allOf:
        - $ref: '#/components/schemas/GeometryElement'
        - type: object
          required:
          - coordinates
          properties:
            'coordinates':
              type: array
              items:
                $ref: '#/components/schemas/LineStringCoordinates'

    #---------------------------------------------------------------------------
    'Polygon':
      description: GeoJSon geometry
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.6'
      allOf:
        - $ref: '#/components/schemas/GeometryElement'
        - type: object
          required:
          - coordinates
          properties:
            'coordinates':
              type: array
              items:
                $ref: '#/components/schemas/LinearRing'

    #---------------------------------------------------------------------------
    'MultiPolygon':
      description: GeoJSon geometry
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.7'
      allOf:
        - $ref: '#/components/schemas/GeometryElement'
        - type: object
          required:
          - coordinates
          properties:
            'coordinates':
              type: array
              items:
                type: array
                items:
                  $ref: '#/components/schemas/LinearRing'

    #---------------------------------------------------------------------------
    'GeometryCollection':
      type: object
      description: >
        GeoJSon geometry collection
        GeometryCollections composed of a single part or a number of parts of a
        single type SHOULD be avoided when that single part or a single object
        of multipart type (MultiPoint, MultiLineString, or MultiPolygon) could
        be used instead.
      externalDocs:
        url: 'https://tools.ietf.org/html/rfc7946#section-3.1.8'
      allOf:
        - $ref: '#/components/schemas/Geometry'
        - type: object
          required:
          - geometries
          properties:
            'geometries':
              type: array
              items:
                $ref: '#/components/schemas/GeometryElement'
              minItems: 0

  parameters:
    geographyParam:
      name: geography
      description: Geographic Resolution/Type (i.e. state, county, zcta3, zcta5).
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/geography'
    stateParam:
      name: states
      description: Two-Letter State Abbrevation to filter results to.
      in: query
      required: false
      explode: true
      schema:
        type: array
        items:
          type: string
        example: ['MA', 'VT']
    outcomeParam:
      name: outcome
      description: Outcome to filter on.
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/outcome'
    metricParam:
      name: metric
      description: Metric to filter on.
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/metric'
    demographicMetricParam:
      name: metric
      description: Demographic Metric
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/demographicMetric'
    demographicDataSourceParam:
      name: datasource
      description: Demographic Data Source
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/demographicDataSorce'
    startDateParam:
      name: start_date
      description: Start Date to filter on.
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/isoDate'
    endDateParam:
      name: end_date
      description: End Date to filter on.
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/isoDate'
  
  requestBodies:  
    midBody:
      description: A JSON object containing a list of MIDs. Note MIDs should be valid for geography params.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              'mids':
                type: array
                items:
                  $ref: '#/components/schemas/mid'
    outcomeMetricMIDBody:
      description: A JSON object containing the Outcome, Metrics, and MIDs.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              'mids':
                type: array
                items:
                  $ref: '#/components/schemas/mid'
              'outcome':
                $ref: '#/components/schemas/outcome'
              'metrics':
                type: array
                items:
                  $ref: '#/components/schemas/metric'
    detailMetricMIDBody:
      description: A JSON object containing the Outcome, Metrics, and MIDs. If Aggregate is set to true it will only return the aggregated results (SOC only).
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              'mids':
                type: array
                items:
                  $ref: '#/components/schemas/mid'
              'outcome':
                $ref: '#/components/schemas/outcome'
              'metrics':
                type: array
                items:
                  $ref: '#/components/schemas/metric'
              'aggregate':
                type: boolean
                default: false
    outcomeGeoMIDBody:
      description: A JSON object containing the Outcome, Geographic Resolution, and MIDs.
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              'mids':
                type: array
                items:
                  $ref: '#/components/schemas/mid'
              'outcome':
                $ref: '#/components/schemas/outcome'
              'geography':
                $ref: '#/components/schemas/geography'
      
  responses:
    InvalidParamError:
      description: Parameter Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/invalidParam'
    
    PropertiesResponse:
      description: Main Properties Response. Response is Keyed on MIDs.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/midProperties'