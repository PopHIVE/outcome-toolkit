<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@3//swagger-ui.css" integrity="sha384-NYk8IDQuLP9FVPiLTRpPctm/DNyEr5RYM+oWo/bKuKuULbzRx4vXXe0PtYp+61w6" crossorigin="anonymous">
    <style nonce="**CSP_NONCE**">
      html
      {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
      }

      *,
      *:before,
      *:after
      {
        box-sizing: inherit;
      }

      body
      {
        margin:0;
        background: #fafafa;
      }
    </style>
  </head>

  <body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@3/swagger-ui-bundle.js" integrity="sha384-BWurT7DoPmvNONn2eTOVKmI5hnmyyI/aZucEobRr6vXYEquesdCvhVbYMzMJjKkn" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/swagger-ui-dist@3/swagger-ui-standalone-preset.js" integrity="sha384-+PppK9yWbWLTPGMUWborQ2V1Xk0Gk2ugovL3eiL0sjp7IHWzTaZ0OsKERwpQHLUn" crossorigin="anonymous"></script>
    <script nonce="**CSP_NONCE**">
      window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "{{ url_for('docs.get_spec') }}",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout"
      })
    }
    </script>
  </body>
</html>
