    data_release: 'Jul 2025'
    data_provider: 'Health Verity'
    params:
      input_file: 'hv_aggregate_table_20250731_HV009879/data_submission_Open_Claims_HealthVerity_2025-07-31.gz.parquet'

  aggregated_soc_data:
