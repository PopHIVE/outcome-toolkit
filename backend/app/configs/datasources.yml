        geography: 'ZCTA3'
        start_date: '2022-01-01'
        end_date: '2022-12-31'

  ascvd_scores:
  - name: ' ASCVD Scores'
    parser: 'load_ascvd_aggregate'
    data_release: 'Jul 2025'
    data_provider: 'Veradigm'
    params:
        input_file: 'data_submission_VERADIGM_2025-07.xlsx'

  ascvd_scores_v2:
