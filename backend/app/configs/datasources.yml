version: 0.1.1
datasources:
  users:
  - name: 'User Data'
    parser: 'load_users'  
    data_release: '2025'  
    data_provider: 'Internal'
    params:
      input_file_fr: 'users.csv'

  projects:
  - name: 'Project Data'
    parser: 'load_projects'
    data_release: '2025'
    data_provider: 'Internal'
    params:
      input_file_fr: 'projects.csv'

  project_measurements:
  - name: 'Project Measurements Data'
    parser: 'load_project_measurements'
    data_release: '2025'
    data_provider: 'Internal'
    params:
      input_file_fr: 'project_measurements.csv'

  mid_metrics:
  - name: 'Mid Metrics Data'
    parser: 'load_mid_metrics'
    data_release: '2025'
    data_provider: 'Internal'
    params:
      input_file_fr: 'mid_metrics.csv'

  target_payouts:
  - name: 'Target Payout Data'
    parser: 'load_target_payouts'
    data_release: '2025'
    data_provider: 'Internal'
    params:
      input_file_fr: 'target_payout_rate.csv'

  project_area_associations:
  - name: 'Project Area Associations'
    parser: 'load_project_areas'
    data_release: '2025'
    data_provider: 'Internal'
    params:
      input_file_fr: 'project_area_association.csv'

  user_project_associations:
  - name: 'User Project Associations'
    parser: 'load_user_projects'
    data_release: '2025'
    data_provider: 'Internal'
    params:
      input_file_fr: 'user_project_association.csv'

  cb_geos:
  - name: 'State Geos'
    parser: 'load_zipped_census_geos'
    data_release: '2020'
    data_provider: 'Census Bureau Cartographic Boundaries'
    params:
      input_file: 'cb_2020_us_state_500k.zip'
      geography: 'STATE'
  - name: 'County Geos'
    parser: 'load_zipped_census_geos'
    data_release: '2020'
    data_provider: 'Census Bureau Cartographic Boundaries'
    params:
      input_file: 'cb_2020_us_county_500k.zip'
      geography: 'COUNTY'
  - name: 'ZCTA5 Geos'
    parser: 'load_zipped_census_geos'
    data_release: '2020'
    data_provider: 'Census Bureau Cartographic Boundaries'
    params:
      input_file: 'cb_2020_us_zcta520_500k.zip'
      geography: 'ZCTA5'
      geoid_col: 'GEOID20'
      affgeoid_col: 'AFFGEOID20'
  - name: 'ZCTA3 Geos'
    parser: 'load_zipped_census_geos'
    data_release: '2020'
    data_provider: 'Census Bureau Cartographic Boundaries'
    params:
      input_file: 'cb_2020_us_zcta3_500k.shp.zip'
      geography: 'ZCTA3'

  cb_demographics:
  - name: 'Demographics Profile State'
    parser: 'load_demographic_profile'
    data_release: '2020'
    data_provider: 'Census Bureau Census Demographic Profile'
    params:
      input_file: 'cb_demographics_state_2020.csv'
      geography: 'STATE'
      start_date: '2020-01-01'
      end_date: '2020-12-31'
  - name: 'Demographics Profile County'
    parser: 'load_demographic_profile'
    data_release: '2020'
    data_provider: 'Census Bureau Census Demographic Profile'
    params:
      input_file: 'cb_demographics_county_2020.csv'
      geography: 'COUNTY'
      start_date: '2020-01-01'
      end_date: '2020-12-31'
  - name: 'Demographics Profile ZCTA5'
    parser: 'load_demographic_profile'
    data_release: '2020'
    data_provider: 'Census Bureau Census Demographic Profile'
    params:
      input_file: 'cb_demographics_zcta5_2020.csv'
      geography: 'ZCTA5'
      start_date: '2020-01-01'
      end_date: '2020-12-31'
  - name: 'Demographics Profile ZCTA3'
    parser: 'load_demographic_profile'
    data_release: '2020'
    data_provider: 'Census Bureau Census Demographic Profile'
    params:
      input_file: 'cb_demographics_zcta3_2020.csv'
      geography: 'ZCTA3'
      start_date: '2020-01-01'
      end_date: '2020-12-31'

  acs_estimates:
    - name: 'ACS Estimates State'
      parser: 'load_acs_estimates'
      data_release: '2022'
      data_provider: 'Census Bureau 2022 American Community Survey'
      params:
        input_file: 'cb_acs_state_2022.csv'
        geography: 'STATE'
        start_date: '2022-01-01'
        end_date: '2022-12-31'
    - name: 'ACS Estimates Counties'
      parser: 'load_acs_estimates'
      data_release: '2022'
      data_provider: 'Census Bureau 2022 American Community Survey'
      params:
        input_file: 'cb_acs_county_2022.csv'
        geography: 'COUNTY'
        start_date: '2022-01-01'
        end_date: '2022-12-31'
    - name: 'ACS Estimates ZCTA5'
      parser: 'load_acs_estimates'
      data_release: '2022'
      data_provider: 'Census Bureau 2022 American Community Survey'
      params:
        input_file: 'cb_acs_zcta5_2022.csv'
        geography: 'ZCTA5'
        start_date: '2022-01-01'
        end_date: '2022-12-31'
    - name: 'ACS Estimates ZCTA3'
