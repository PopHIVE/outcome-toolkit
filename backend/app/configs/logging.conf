version: 1
disable_existing_loggers: true

formatters:
    standard:
        format: '%(asctime)s [%(levelname)s] %(message)s'

    verbose:
        format: '%(asctime)s [%(levelname)s] %(message)s :: %(funcName)s:%(lineno)d'

handlers:
    console_handler:
        class: logging.StreamHandler
        level: DEBUG
        formatter: standard
        stream: ext://sys.stdout

    file_debug_handler:
        class: logging.handlers.TimedRotatingFileHandler
        level: DEBUG
        when: midnight
        interval: 1
        formatter: standard
        filename: /mnt/logs/backend.debug.log

    file_error_handler:
        class: logging.handlers.TimedRotatingFileHandler
        level: WARN
        when: midnight
        interval: 1
        formatter: verbose
        filename: /mnt/logs/backend.error.log

loggers:
    root:
        level: INFO
        handlers: [console_handler, file_debug_handler, file_error_handler]
        propagate: False

